version: '3.8'

services:
  devcolor-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - devcolor-network

networks:
  devcolor-network:
    driver: bridge
